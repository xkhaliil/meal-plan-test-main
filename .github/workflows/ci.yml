name: CI

# Runs on every PR into main, and on main itself so the branch protection rule
# has a status to require.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    env:
      # The app reads these at module scope, so a build fails without them.
      # CI never talks to the real services: these are placeholders, and the
      # test suite mocks Prisma rather than opening the database.
      DATABASE_URL: "file:./ci.db"
      JWT_SECRET: "ci-secret-not-used-outside-this-job"
      OPENAI_API_KEY: "sk-ci-placeholder"
      GEMINI_API_KEY: "ci-placeholder"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` over `npm install`: it installs exactly the lockfile and fails
      # if package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code; without this, typecheck and build
      # can't resolve the model types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # unit + integration + component projects. Integration builds its own
      # throwaway SQLite database in globalSetup.
      - name: Test (unit, integration, component)
        run: npm test

      # Last, because it's the slowest and the others localise failures better.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Only worth the browser download once the cheap checks are green.
    needs: verify

    env:
      DATABASE_URL: "file:./e2e.db"
      JWT_SECRET: "ci-secret-not-used-outside-this-job"
      OPENAI_API_KEY: "sk-ci-placeholder"
      GEMINI_API_KEY: "ci-placeholder"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        # The specs sign in as a seeded account, so the schema and the seed
        # data both have to exist before the server starts.
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx prisma db seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself under CI.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
