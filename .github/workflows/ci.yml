name: CI

# Runs on every PR into main, and on main itself so the branch protection rule
# has a status to require.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    # Integration tests and the E2E seed need a real Postgres now that the app
    # has left SQLite behind. Each integration run creates its own schema in
    # here and drops it again.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The app reads these at module scope, so a build fails without them.
      # CI never talks to the real third-party services: those are placeholders.
      # The database is real, because the integration project needs one.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mealplan_test"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mealplan_test"
      JWT_SECRET: "ci-secret-not-used-outside-this-job"
      OPENAI_API_KEY: "sk-ci-placeholder"
      GEMINI_API_KEY: "ci-placeholder"
      STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` over `npm install`: it installs exactly the lockfile and fails
      # if package.json and the lock have drifted apart.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code; without this, typecheck and build
      # can't resolve the model types.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # unit + integration + component projects. Integration creates its own
      # throwaway Postgres schema in globalSetup and drops it afterwards; it is
      # left out of the run entirely if TEST_DATABASE_URL is unset, so the
      # variable above is what keeps it enforced here.
      - name: Test (unit, integration, component)
        run: npm test

      # Last, because it's the slowest and the others localise failures better.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Only worth the browser download once the cheap checks are green.
    needs: verify

    # Integration tests and the E2E seed need a real Postgres now that the app
    # has left SQLite behind. Each integration run creates its own schema in
    # here and drops it again.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mealplan_test"
      JWT_SECRET: "ci-secret-not-used-outside-this-job"
      OPENAI_API_KEY: "sk-ci-placeholder"
      GEMINI_API_KEY: "ci-placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
      # Real test-mode credentials if the repository has them, placeholders
      # otherwise. The price test skips itself when Stripe isn't configured,
      # rather than asserting a figure that can't exist here.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_PRO_PRODUCT_ID: ${{ secrets.STRIPE_PRO_PRODUCT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        # The specs sign in as a seeded account, so the schema and the seed
        # data both have to exist before the server starts.
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx prisma db seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and starts the app itself under CI.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
